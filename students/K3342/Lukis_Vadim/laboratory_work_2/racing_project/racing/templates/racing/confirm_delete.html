{% extends 'racing/base.html' %}
{% block title %}Удаление{% endblock %}

{% block content %}
<div class="card mt-4">
    <div class="card-body">
        <h2 class="card-title text-danger">Подтвердите удаление</h2>
        <p class="card-text">Вы действительно хотите удалить <strong>{{ type }}</strong>: <em>{{ object }}</em>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
